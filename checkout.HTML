<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f1f1;
            padding: 40px;
            margin: 0;
        }

        .box {
            max-width: 650px;
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.07);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 22px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        .total {
            text-align: right;
            font-size: 20px;
            margin-top: 10px;
            font-weight: bold;
        }

        label {
            font-weight: bold;
            margin-top: 18px;
            display: block;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            margin-top: 8px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #222;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            margin-top: 25px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Checkout</h2>

    {% if items %}
    <table>
        <thead>
        <tr>
            <th>Product</th>
            <th>Qty</th>
            <th>Subtotal</th>
        </tr>
        </thead>
        <tbody>
        {% for item in items %}
        <tr>
            <td>{{ item.product.name }}</td>
            <td>{{ item.qty }}</td>
            <td>₹{{ item.subtotal }}</td>
        </tr>
        {% endfor %}
        </tbody>
    </table>

    <div class="total">
        Total: ₹{{ total }}
    </div>

    <form method="POST" action="{{ url_for('checkout') }}">

        <label>Delivery Address</label>
        <input type="text" name="address" required placeholder="Enter your complete address">

        <label>Payment Method</label>
        <select name="payment" required>
            <option value="COD">Cash on Delivery (COD)</option>
            <option value="Online">Online Payment</option>
        </select>

        <button type="submit">Place Order</button>

    </form>

    {% else %}
        <h3>Your cart is empty.</h3>
    {% endif %}

</div>

</body>
</html>
